services:
  # 🟢 1. BACKEND SERVICE LAYER (Node.js API Server - Free Plan)
  - type: web
    name: smart-student-hub-backend
    runtime: node
    plan: free              # Sararri kun Render irratti kaffaltii malee bilisaan akka hojjetu godha
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # 🔵 2. FRONTEND STATIC HOSTING LAYER (React Vite Static Site)
  - type: web
    name: smart-student-hub-frontend
    runtime: static
    plan: free              # Kuniis static hosting herrega kaffaltii akka hin gaafanne ittisa
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
