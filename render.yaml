services:
  # 🟢 1. SARARA HOJII BACKEND (Node.js API Server)
  - type: web
    name: smart-student-hub-backend
    runtime: node
    rootDir: backend        # Foldara backend keessa seenee hojjeta
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MONGO_URI
        sync: false        # Daandii Alwaysdata irraa fudhatte Render irratti galchita
      - key: JWT_SECRET
        sync: false        # Koodii iccitii JWT Render irratti galchita

  # 🔵 2. AGARSIIFTUU FRONTEND (React Static Web Hosting)
  - type: web
    name: smart-student-hub-frontend
    runtime: static
    rootDir: frontend       # Foldara frontend keessa seenee ijaara
    buildCommand: npm install && npm run build
    publishDir: dist        # Vite koodii xumurame foldara dist keessa kaaya
    routes:
      - type: rewrite
        src: /*
        dest: /index.html   # React Router akka sirriitti hojjetuuf gargaara
