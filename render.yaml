services:
  # 🟢 1. BACKEND SERVICE LAYER (Node.js API Server - Free Instance)
  - type: web
    name: smart-student-hub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # 🔵 2. FRONTEND HOSTING LAYER (React Static Site - Fully Free)
  - type: static_site
    name: smart-student-hub-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
