services:
  # 🟢 1. BACKEND SERVICE LAYER (Node.js API Server - Free Layer)
  - type: web
    name: smart-student-hub-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # 🔵 2. FRONTEND HOSTING LAYER (React Static Site - Fully Free)
  - type: web                  # Gosti isaa 'web' ta'uu qaba
    name: smart-student-hub-frontend
    runtime: static         # Inni kun static site ta'uu isaa Render'f mirkaneessa
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist # Render static site eeguuf kana fayyadama
